<div class="container">
    <div class="col-md-12 p-0">
      <h2>
        Array Items
      </h2>
  </div>
  <div class="row context">
    <div class="col-md-9 editor">
      <ace [mode]="'text'" [theme]="'monokai'" [(value)]="value" (keyup)="toArray()" (change)="toArray()"></ace>
    </div>
    <div class="col-md-3 results">
      <div class="row">
        <mat-card class="example-card" appearance="outlined">
          <mat-card-actions>
            <div class="options">
              <p>
                <mat-slide-toggle (change)="IgnoreSpace($event)" [(ngModel)]="checked">Ignorar Linha Vazia</mat-slide-toggle>
              </p>
              <p>
                <mat-slide-toggle (change)="IgnoreNumber($event)" [(ngModel)]="skipNumber">Ignorar Numero</mat-slide-toggle>
              </p>
            </div>
          </mat-card-actions>
        </mat-card>
      </div>
        <div class="row">
        <mat-card class="example-card" appearance="outlined">
          <mat-card-header>
            <mat-card-title>Raw</mat-card-title>
          </mat-card-header>
          <mat-card-content>
            <span class="content-array">{{ arrayRaw }}</span>
          </mat-card-content>
          <mat-card-actions class="copy">
            <button mat-flat-button (click)="copyToClipboard()" [cdkCopyToClipboard]="arrayRaw">
              <mat-icon aria-hidden="false" aria-label="Example home icon" fontIcon="copy_all"></mat-icon>
            </button>
          </mat-card-actions>
        </mat-card>
      </div>
      <div class="row">
        <mat-card class="example-card" appearance="outlined">
          <mat-card-header>
            <mat-card-title>
              Array Typescript
            </mat-card-title>
          </mat-card-header>
          <mat-card-content>
            <span class="content-array">
              {{ array.length > 1 ? JSON.stringify(array) : '' }}
            </span>
          </mat-card-content>
          <mat-card-actions class="copy">
            <button mat-flat-button (click)="copyToClipboard()" [cdkCopyToClipboard]="JSON.stringify(array)">
              <mat-icon aria-hidden="false" aria-label="Example home icon" fontIcon="copy_all"></mat-icon>
            </button>
          </mat-card-actions>
        </mat-card>
      </div>
      <div class="row">
        <mat-card class="example-card" appearance="outlined">
          <mat-card-header>
            <mat-card-title>Array</mat-card-title>
          </mat-card-header>
          <mat-card-content>
            <span class="content-array">{{ arraySql }}</span>
          </mat-card-content>
          <mat-card-actions class="copy">
            <button mat-flat-button (click)="copyToClipboard()" [cdkCopyToClipboard]="arraySql">
              <mat-icon aria-hidden="false" aria-label="Example home icon" fontIcon="copy_all"></mat-icon>
            </button>
          </mat-card-actions>
        </mat-card>
      </div>
    </div>
  </div>
</div>
