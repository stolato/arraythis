<div class="app-container">
  <header class="app-header" (dblclick)="onHeaderDoubleClick($event)">
    <div class="brand">
      <mat-icon class="brand-icon" aria-hidden="true">data_array</mat-icon>
      <span class="brand-name">ArrayThis</span>
    </div>
    <div class="header-right">
      <span class="item-badge" *ngIf="array.length > 0">{{ itemCountLabel }}</span>
      <button mat-button class="clear-btn" (click)="clearEditor()" *ngIf="value">
        <mat-icon aria-hidden="true">clear_all</mat-icon>
        Limpar
      </button>
      <button mat-icon-button class="theme-btn" (click)="toggleTheme()"
              [attr.aria-label]="theme === 'dark' ? 'Ativar tema claro' : 'Ativar tema escuro'"
              [title]="theme === 'dark' ? 'Tema claro' : 'Tema escuro'">
        <mat-icon aria-hidden="true">{{ theme === 'dark' ? 'light_mode' : 'dark_mode' }}</mat-icon>
      </button>
    </div>
  </header>

  <main class="main-content">
    <section class="editor-pane">
      <div class="pane-header">
        <span class="pane-label">Entrada</span>
        <span class="pane-hint">um item por linha</span>
      </div>
      <textarea *ngIf="useNativeEditor; else aceEditor"
                class="native-editor"
                aria-label="Lista de entrada, um item por linha"
                placeholder="Cole sua lista aqui, um item por linha"
                autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false"
                [ngModel]="value" (ngModelChange)="onInput($event)"></textarea>
      <ng-template #aceEditor>
        <ace [mode]="'text'" [theme]="'monokai'" [value]="value" (valueChange)="onInput($event)" class="ace-editor"></ace>
      </ng-template>
    </section>

    <section class="output-pane">
      <div class="settings-bar">
        <label class="setting-item" title="Remove as linhas em branco">
          <mat-slide-toggle color="primary" (change)="IgnoreSpace($event)" [(ngModel)]="checked"></mat-slide-toggle>
          <span>Ignorar vazios</span>
        </label>
        <label class="setting-item" title="Mantém números como texto (entre aspas)">
          <mat-slide-toggle color="primary" (change)="IgnoreNumber($event)" [(ngModel)]="skipNumber"></mat-slide-toggle>
          <span>Números como texto</span>
        </label>
        <label class="setting-item" title="Remove espaços no início e no fim de cada item">
          <mat-slide-toggle color="primary" (change)="ToggleTrim($event)" [(ngModel)]="trimSpaces"></mat-slide-toggle>
          <span>Remover espaços</span>
        </label>
        <label class="setting-item" title="Usa aspas simples em vez de duplas na aba SQL IN">
          <mat-slide-toggle color="primary" (change)="ToggleSqlQuotes($event)" [checked]="sqlQuotes === 'single'"></mat-slide-toggle>
          <span>Aspas simples</span>
        </label>
      </div>

      <div class="tab-bar">
        <button class="tab-btn" [class.active]="selectedTab === 'raw'" (click)="selectTab('raw')">Texto</button>
        <button class="tab-btn" [class.active]="selectedTab === 'ts'" (click)="selectTab('ts')">TypeScript</button>
        <button class="tab-btn" [class.active]="selectedTab === 'sql'" (click)="selectTab('sql')">SQL IN</button>
      </div>

      <div class="output-body">
        <div class="output-text active">{{ currentOutput }}<span *ngIf="!currentOutput" class="empty-hint">Cole uma lista no editor para ver o resultado aqui</span></div>
      </div>

      <div class="output-footer">
        <button mat-flat-button class="copy-btn" [class.copied]="copied"
                [disabled]="!currentOutput"
                [cdkCopyToClipboard]="currentOutput"
                (cdkCopyToClipboardCopied)="onCopied($event)">
          <mat-icon aria-hidden="true">{{ copied ? 'check' : 'content_copy' }}</mat-icon>
          {{ copied ? 'Copiado!' : 'Copiar' }}
        </button>
        <span class="visually-hidden" aria-live="polite">{{ copied ? 'Copiado para a área de transferência' : '' }}</span>
      </div>
    </section>
  </main>
</div>
