<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Array this - Tilt Tecnologia</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#111113" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)">
  <script>
    // Apply a saved theme before first paint to avoid a flash of the wrong theme
    try {
      var t = localStorage.getItem('arraythis-theme');
      if (t === 'light' || t === 'dark') {
        document.documentElement.dataset.theme = t;
        var c = t === 'dark' ? '#111113' : '#fafafa';
        document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) { m.setAttribute('content', c); });
      }
    } catch (e) {}
  </script>
</head>
<body class="mat-typography">
  <app-root></app-root>
  <noscript>Ative o JavaScript para usar esta aplicação.</noscript>
</body>
</html>
